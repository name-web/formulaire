name: Test SSH cPanel

on:
  push:
    branches:
      - kamal

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH ports
        run: |
          echo "Testing port 22..."
          timeout 5 bash -c '</dev/tcp/web51.lws-hosting.com/22' && echo "PORT 22 OPEN" || echo "PORT 22 CLOSED"

          echo "Testing port 2222..."
          timeout 5 bash -c '</dev/tcp/web51.lws-hosting.com/2222' && echo "PORT 2222 OPEN" || echo "PORT 2222 CLOSED"

          echo "Testing port 2200..."
          timeout 5 bash -c '</dev/tcp/web51.lws-hosting.com/2200' && echo "PORT 2200 OPEN" || echo "PORT 2200 CLOSED"